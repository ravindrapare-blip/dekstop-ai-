[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-assistant"
version = "0.0.1"
description = "Lightweight local AI desktop assistant for an older MacBook Air"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pyyaml>=6,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["backend", "voice", "safety", "automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
