# Assistant configuration. No secrets here; the shared service token lives in data/.token.
# Values are conservative defaults for a 2017 MacBook Air (2 cores, 8 GB RAM).

backend:
  host: 127.0.0.1        # must stay loopback; the backend refuses to start otherwise
  port: 8765             # log goes to data/logs/backend.log (set by scripts/start.sh)

ollama:
  url: http://127.0.0.1:11434   # must be a local address; the client refuses anything else
  model: qwen2.5:3b      # any pulled model works, e.g. qwen2.5-coder:7b or llama3.1:8b
  keep_alive: 5m         # unload the model after 5 idle minutes
  num_ctx: 2048
  num_predict: 256       # cap on reply length; a tool call is far shorter
  timeout_seconds: 120   # slow CPUs need generous read timeouts
  retries: 1             # one more try, after a short pause, if Ollama is still starting or has a hiccup (never after a timeout)
  # Server-side limits, applied when the app starts Ollama itself (phase 9):
  max_loaded_models: 1
  num_parallel: 1

brain:
  # Gemini (cloud) as the main brain, the local Ollama model as the automatic fallback. OFF by default: the assistant is
  # fully local unless you turn this on. The API key never goes in this file: put it in .env (copy .env.example).
  # Environment variables / .env override these: USE_GEMINI, USE_LOCAL_FALLBACK, GEMINI_MODEL, SAFE_MODE.
  use_gemini: false
  use_local_fallback: true     # switch to the local model automatically when Gemini fails, and back when it recovers
  gemini_model: gemini-2.0-flash   # check Google's current model names; GEMINI_MODEL overrides this
  timeout_seconds: 10          # how long to wait for Gemini before using the local model
  cooldown_seconds: 300        # after quota/network/timeout trouble, stay on the local model this long, then try Gemini again
  auth_cooldown_seconds: 1800  # after a rejected key or unknown model (waiting a minute won't fix those)
  send_memory_to_gemini: false # your saved preferences stay on this Mac unless you set this to true
  speak_switch_notice: false   # read "I switched to the local model" aloud too (needs voice output)

router:
  max_retries: 1         # one corrective retry when the model returns invalid JSON

voice:
  enabled: true
  stt_engine: whisper    # whisper (whisper.cpp, local) or macos (use macOS Dictation in the text box); STT_ENGINE overrides
  tts_engine: piper      # piper (local, default) or say (the Mac's voice); TTS_ENGINE overrides; google is not built yet
  max_text_chars: 500    # longest reply that is spoken; longer ones are shortened
  system_voice_fallback: true   # macOS "say" voice when Piper is not installed
  # Paths are relative to the project root. See docs/voice.md for setup.
  whisper:
    binary: reference/whisper.cpp/build/bin/whisper-cli
    model: reference/whisper.cpp/models/ggml-tiny.en.bin
    language: en         # use "en" with the .en models
    threads: 2
    timeout_seconds: 60
  piper:
    binary: piper        # a name is searched on PATH; a path is relative to the project
    voice: data/models/en_US-lessac-low.onnx   # needs its .onnx.json file next to it
    timeout_seconds: 30

browser:
  enabled: true          # the browser helper (Node) is only started when you first ask for a browser action
  host: 127.0.0.1
  port: 8766
  node: node             # a name is searched on PATH; Node 18 or newer (run "cd browser && npm install" once)
  chrome_path: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
  profile_dir: data/chrome-profile   # dedicated profile, not your own; sign in to sites here once and it stays
  idle_minutes: 30       # the helper and its Chrome window close after this long without a browser action

automation:
  enabled: true
  hammerspoon: true      # use Hammerspoon when it is running; otherwise AppleScript and "open"
  host: 127.0.0.1        # Hammerspoon's local listener; must match the port in ~/.hammerspoon (scripts/setup_hammerspoon.sh)
  port: 8767
  token_file: data/.token   # shared secret between the backend and Hammerspoon (created automatically)

organizer:
  enabled: true
  folders: [~/Desktop, ~/Downloads]   # the only folders it will organize (inside your home folder, never hidden ones)
  settle_seconds: 60      # files changed in the last minute are left alone (they may still be downloading)
  max_files: 200          # at most this many files in one preview
  # Without a rule here, every move waits for your approval. A rule is YOUR standing permission: only you can add one,
  # by editing this file (the assistant cannot). It covers a plan only if ALL of its moves fit the rule.
  trusted_rules: []
  #  - name: downloads-pictures
  #    folder: ~/Downloads
  #    categories: [Images, Media]   # optional: Work, Documents, Media, Images, Personal, Other
  #    max_files: 25                 # optional, default 25

files:
  # Searched first. Everything must be inside your home folder; anything else is ignored.
  search_dirs: [~/Desktop, ~/Documents, ~/Downloads]
  # Only searched if nothing was found above. "~" is listed but never entered.
  more_dirs: [~/Pictures, ~/Movies, ~/Music, "~"]
  max_depth: 3
  max_entries: 20000          # stop a search after looking at this many items
  time_budget_seconds: 2

safety:
  policy_file: safety/policy.yaml
  audit_file: data/logs/audit.jsonl  # every decision is written here before an action is authorized
  approval_timeout_seconds: 60       # no answer means the request expires (nothing runs)
  max_pending: 5                     # unanswered confirmations kept at once (oldest dropped)
  dry_run: false                     # true: describe every action, run none
  safe_mode: false                   # true (or SAFE_MODE=true): every browser action asks you first

memory:
  enabled: true
  notifications: true        # macOS notification when a reminder is due (first time, allow it in System Settings > Notifications)
  history: true              # keep a short log of what you asked (trimmed), so you can review or clear it
  history_limit: 300         # oldest entries are dropped beyond this
  history_days: 30           # and anything older than this
  prompt_preferences: 8      # how many remembered preferences are shown to the model (0 = none)
  # Everything is stored in the file below, on this Mac only, readable by you only.

data:
  database: data/assistant.db
